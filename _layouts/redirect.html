<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url={{ page.rurl | relative_url }}" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title | default: 'Redirecting...' }}</title>
    <link rel="canonical" href="{{ page.rurl | relative_url }}" />
  </head>
  <body>
    <p>Redirecting to <a href="{{ page.rurl | relative_url }}">{{ page.rurl }}</a>.</p>
  </body>
</html>
